# Lima VM for the single-node Kubernetes cluster.
#   make vm-up   (adds the ./backups mount with an absolute path, then starts the VM)
# Spec from the assignment: 4 vCPU, 8 GB RAM, 40 GB disk, Debian 13 (trixie).
---
# vmType and mountType unset: Lima picks vz + virtiofs on macOS, qemu + 9p on Linux.
# Not virtiofs on QEMU: Lima backs all guest RAM with a /dev/shm file, which is smaller than 8 GiB on a
# 16 GiB host, and the guest locks up (B-058).
cpus: 4
memory: 8GiB
disk: 40GiB

# Dated build pinned by digest; keep in sync with debian_image_build in
# ansible/group_vars/all/versions.yml (Lima can't read Ansible vars).
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-arm64-20261103-2651.qcow2
    arch: aarch64
    digest: sha512:5d3ecec46fd29605db4084388a1e2eb82fd19a80202898f962840ea73793261de721e505e3877c829ae86c37fdd2f6c205b0b3b1337a89d0d4b98d9081adc0c2
  # x86_64 runs only on Linux (QEMU + 9p): the `generic` image, since the `genericcloud` kernel has no 9p (B-058).
  - location: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-generic-amd64-20261103-2651.qcow2
    arch: x86_64
    digest: sha512:1207e6e3efaff8ee77ab7a32c156a3eea6a9e53f94cfc48efbd1f49ba554ca36ac62ab27395aa813a1775a8c0a393b1a1ce5377d9e5670f6113e3110c57fee4b

# The VM must be a *clean* Debian: no Lima-managed containerd/nerdctl.
# Ansible installs and owns the container runtime.
containerd:
  system: false
  user: false

# No home-directory mount. The only mount (./backups -> /mnt/host-backups,
# writable) is injected by the Makefile so it can use an absolute path.
mounts: []

ssh:
  localPort: 0
  loadDotSSHPubKeys: false

# Lima forwards ports by watching *listening sockets* in the guest.
# Traefik must therefore listen itself (hostNetwork), not via CNI hostPort
# (iptables DNAT, no socket -> Lima never sees it). Traefik runs non-root without
# capabilities, so it listens on 8443/8000 and Lima maps them to the Mac's 443/80
# (B-009; macOS lets non-root bind 443).
portForwards:
  - guestPort: 8443
    hostPort: 443
  - guestPort: 8000
    hostPort: 80
  - guestPort: 6443
    hostPort: 6443
  # Ignore everything else, TCP and UDP, on any guest address (NodePorts, kubelet,
  # etcd, metrics, DNS). proto any covers UDP, which Lima's built-in fallback rule
  # would otherwise forward (B-025). An explicit guestIP 0.0.0.0 defaults to
  # guestIPMustBeZero: true (matches only 0.0.0.0/:: binds); false makes it match
  # every bind, 127.0.0.1 included (B-028).
  - guestIP: 0.0.0.0
    guestIPMustBeZero: false
    guestPortRange: [1, 65535]
    proto: any
    ignore: true
