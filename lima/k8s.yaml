# Lima VM for the single-node Kubernetes cluster.
#   make vm-up   (adds the ./backups mount with an absolute path, then starts the VM)
# Spec from the assignment: 4 vCPU, 8 GB RAM, 40 GB disk, Debian 13 (trixie).
---
vmType: vz             # Apple Virtualization.framework (Apple Silicon, macOS 13+)
cpus: 4
memory: 8GiB
disk: 40GiB

# Dated build pinned by digest; keep in sync with debian_image_build in
# ansible/group_vars/all/versions.yml (Lima can't read Ansible vars).
images:
  - location: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-arm64-20261103-2651.qcow2
    arch: aarch64
    digest: sha512:5d3ecec46fd29605db4084388a1e2eb82fd19a80202898f962840ea73793261de721e505e3877c829ae86c37fdd2f6c205b0b3b1337a89d0d4b98d9081adc0c2
  - location: https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-amd64-20261103-2651.qcow2
    arch: x86_64
    digest: sha512:d25999de0770d4cde1be72c299ba3ad94eac7ea8fd4d18f8cc86c69df69337e2e8a91d64465a9bfd8f2a78c566fcbcb0842eacc91c09efdef72d719d9f13b535

# The VM must be a *clean* Debian: no Lima-managed containerd/nerdctl.
# Ansible installs and owns the container runtime.
containerd:
  system: false
  user: false

# No home-directory mount. The only mount (./backups -> /mnt/host-backups,
# writable) is injected by the Makefile so it can use an absolute path.
mounts: []
mountType: virtiofs

ssh:
  localPort: 0
  loadDotSSHPubKeys: false

# Lima forwards ports by watching *listening sockets* in the guest.
# Traefik must therefore bind 80/443 itself (hostNetwork), not via CNI hostPort
# (iptables DNAT, no socket -> Lima never sees it). macOS lets non-root bind 443.
portForwards:
  - guestPort: 443
    hostPort: 443
  - guestPort: 80
    hostPort: 80
  - guestPort: 6443
    hostPort: 6443
  # Ignore everything else, TCP and UDP, on any guest address (NodePorts, kubelet,
  # metrics, DNS). guestIP 0.0.0.0 matches every bind; proto any covers UDP, which
  # Lima's built-in fallback rule would otherwise forward (B-025).
  - guestIP: 0.0.0.0
    guestPortRange: [1, 65535]
    proto: any
    ignore: true
