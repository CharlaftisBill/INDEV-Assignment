---
# Your own Debian 13 VM over SSH, used instead of Lima when external-vm.conf exists (make picks this file).
# Connection details come from external-vm.conf at the repo root (key=value, see external-vm.conf.example).
all:
  children:
    k8s:
      hosts:
        k8s-node:
          _ext_conf: "{{ inventory_dir }}/../../external-vm.conf"
          _ext_key: "{{ lookup('ansible.builtin.ini', 'ssh_key', type='properties', file=_ext_conf, default='') }}"
          ansible_host: "{{ lookup('ansible.builtin.ini', 'host', type='properties', file=_ext_conf) }}"
          ansible_user: "{{ lookup('ansible.builtin.ini', 'user', type='properties', file=_ext_conf) }}"
          ansible_port: "{{ lookup('ansible.builtin.ini', 'port', type='properties', file=_ext_conf, default='22') }}"
          # Logged in as root: no sudo (a minimal Debian may not have it).
          ansible_become: "{{ ansible_user != 'root' }}"
          # B-065: ansible.cfg turns host-key checks off (Lima's keys change on rebuild). Your VM's key is trusted on
          # first use and checked after that, in ~/.ssh/known_hosts, the same as scripts/external.sh.
          ansible_host_key_checking: true
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=accept-new
            {{ ('-o IdentitiesOnly=yes -i ' ~ _ext_key) if _ext_key else '' }}
          # Internet for the VM (external-vm.conf egress=): host (default, air-gapped VM: the host's allowlisted proxy
          # over SSH, scripts/external.sh), proxy (proxy=<url>, the reviewer's own), direct (the VM has internet).
          _ext_egress: "{{ lookup('ansible.builtin.ini', 'egress', type='properties', file=_ext_conf, default='host') }}"
          vm_egress_port: 18128  # = EGRESS_PORT in scripts/external.sh
          vm_proxy_url: >-
            {{ ('http://127.0.0.1:' ~ vm_egress_port) if _ext_egress == 'host' else
               (lookup('ansible.builtin.ini', 'proxy', type='properties', file=_ext_conf, default='') if _ext_egress == 'proxy' else '') }}
          # Without direct internet the host downloads the model and copies it in, so the llm namespace keeps no egress at all.
          llm_app_model_from_host: "{{ _ext_egress != 'direct' }}"
          # No Lima mount here: snapshots go to a directory on the VM (outside Kubernetes); make backups-pull copies them to ./backups.
          etcd_backup_require_mount: false
          node_backup_dir: "{{ lookup('ansible.builtin.ini', 'backup_dir', type='properties', file=_ext_conf, default='/var/backups/etcd') }}"
