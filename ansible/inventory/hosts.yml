---
# Single node: control plane + workloads.
# Connection details come from Lima's generated ssh config; host alias is "lima-<name>".
all:
  children:
    k8s:
      hosts:
        k8s-node:
          ansible_host: lima-k8s
          ansible_become: true
          # Absolute path: ssh does not expand "~" in -F (B-023).
          ansible_ssh_common_args: "-F {{ lookup('ansible.builtin.env', 'HOME') }}/.lima/k8s/ssh.config"
