---
# The private key is generated on the host and never leaves it; the cluster CA signs the cert through the CSR API.
# Reissue when the cert is missing, not the operator's, not for this key, not signed by the current cluster CA
# (VM rebuilt), or expires within the renew window. Otherwise nothing changes.
- name: Create the host directories for operator credentials
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "0700"
  loop:
    - {path: "{{ host_secrets_dir }}"}
    - {path: "{{ host_out_dir }}"}
  delegate_to: localhost
  become: false

- name: Create the operator private key (EC P-256)
  community.crypto.openssl_privatekey:
    path: "{{ hardening_operator_key }}"
    type: ECC
    curve: secp256r1
    mode: "0600"
    regenerate: never
  delegate_to: localhost
  become: false
  no_log: true

- name: Read the cluster CA certificate
  ansible.builtin.slurp:
    src: "{{ hardening_cluster_ca }}"
  register: hardening_ca_slurp

- name: Inspect the cluster CA certificate
  community.crypto.x509_certificate_info:
    content: "{{ hardening_ca_slurp.content | b64decode }}"
  register: hardening_ca_info
  delegate_to: localhost
  become: false

- name: Look for an existing operator certificate
  ansible.builtin.stat:
    path: "{{ hardening_operator_cert }}"
  register: hardening_cert_stat
  delegate_to: localhost
  become: false

- name: Inspect the operator private key
  community.crypto.openssl_privatekey_info:
    path: "{{ hardening_operator_key }}"
  register: hardening_key_info
  delegate_to: localhost
  become: false
  no_log: true

- name: Inspect the existing operator certificate
  community.crypto.x509_certificate_info:
    path: "{{ hardening_operator_cert }}"
    valid_at:
      renew: "+{{ hardening_cert_renew_days }}d"
  register: hardening_cert_info
  when: hardening_cert_stat.stat.exists
  delegate_to: localhost
  become: false

- name: Decide whether to issue a certificate
  ansible.builtin.set_fact:
    hardening_reissue: >-
      {{ not hardening_cert_stat.stat.exists
         or hardening_cert_info.subject.commonName != hardening_operator_user
         or (hardening_cert_info.subject.organizationName | default('')) != hardening_operator_group
         or hardening_cert_info.public_key_fingerprints.sha256 != hardening_key_info.public_key_fingerprints.sha256
         or hardening_cert_info.authority_key_identifier != hardening_ca_info.subject_key_identifier
         or not hardening_cert_info.valid_at.renew }}
  no_log: true

- name: Issue the operator certificate through the CSR API
  when: hardening_reissue | bool
  block:
    - name: Build the certificate signing request
      community.crypto.openssl_csr_pipe:
        privatekey_path: "{{ hardening_operator_key }}"
        common_name: "{{ hardening_operator_user }}"
        organization_name: "{{ hardening_operator_group }}"
      register: hardening_csr
      delegate_to: localhost
      become: false
      no_log: true

    - name: Submit the CertificateSigningRequest
      kubernetes.core.k8s:
        kubeconfig: "{{ hardening_kubeconfig }}"
        state: present
        template: operator-csr.yaml.j2
      vars:
        hardening_csr_name: "operator-{{ ansible_facts['date_time']['epoch'] }}"
        hardening_csr_pem: "{{ hardening_csr.csr }}"

    - name: Approve the CertificateSigningRequest
      ansible.builtin.command: >-
        kubectl --kubeconfig {{ hardening_kubeconfig }} certificate approve operator-{{ ansible_facts['date_time']['epoch'] }}
      changed_when: true

    - name: Wait for the signed certificate
      kubernetes.core.k8s_info:
        kubeconfig: "{{ hardening_kubeconfig }}"
        api_version: certificates.k8s.io/v1
        kind: CertificateSigningRequest
        name: "operator-{{ ansible_facts['date_time']['epoch'] }}"
      register: hardening_csr_status
      until: hardening_csr_status.resources | length > 0 and hardening_csr_status.resources[0].status.certificate is defined
      retries: "{{ hardening_csr_timeout_retries }}"
      delay: 2

    - name: Write the operator certificate on the host
      ansible.builtin.copy:
        content: "{{ hardening_csr_status.resources[0].status.certificate | b64decode }}"
        dest: "{{ hardening_operator_cert }}"
        mode: "0600"
      delegate_to: localhost
      become: false

    - name: Remove the CertificateSigningRequest
      kubernetes.core.k8s:
        kubeconfig: "{{ hardening_kubeconfig }}"
        api_version: certificates.k8s.io/v1
        kind: CertificateSigningRequest
        name: "operator-{{ ansible_facts['date_time']['epoch'] }}"
        state: absent

- name: Read the operator certificate and key
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ hardening_operator_cert }}"
    - "{{ hardening_operator_key }}"
  register: hardening_pems
  delegate_to: localhost
  become: false
  no_log: true

- name: Write the operator kubeconfig
  ansible.builtin.template:
    src: operator.kubeconfig.j2
    dest: "{{ hardening_operator_conf }}"
    mode: "0600"
  vars:
    hardening_ca_b64: "{{ hardening_ca_slurp.content }}"
    hardening_cert_b64: "{{ hardening_pems.results[0].content }}"
    hardening_key_b64: "{{ hardening_pems.results[1].content }}"
  delegate_to: localhost
  become: false
  no_log: true
