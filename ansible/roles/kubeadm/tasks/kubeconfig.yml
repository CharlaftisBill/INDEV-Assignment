---
- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: "{{ kubeadm_admin_conf }}"
  register: kubeadm_admin_conf_content
  no_log: true

- name: Create the host output directory
  ansible.builtin.file:
    path: "{{ kubeadm_host_admin_conf | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

# kubeadm writes the node address; host clients use Lima's forward instead.
- name: Assert the admin kubeconfig points at the node address
  ansible.builtin.assert:
    that:
      - "('server: ' ~ kubeadm_node_api_server) in (kubeadm_admin_conf_content.content | b64decode)"
    quiet: true
  no_log: true

- name: Write the host admin kubeconfig (server = Lima forward)
  ansible.builtin.copy:
    content: "{{ kubeadm_admin_conf_content.content | b64decode | replace(kubeadm_node_api_server, kubeadm_host_api_server) }}"
    dest: "{{ kubeadm_host_admin_conf }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
