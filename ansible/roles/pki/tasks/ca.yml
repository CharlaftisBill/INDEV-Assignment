---
# Root CA on the host, created once. Existing files are never regenerated:
# a new key would orphan the committed certs/ca.crt and every issued certificate.
# A cert without its key (fresh clone) fails instead of getting a new, unrelated key (B-037).
- name: Create the host directories for the CA key and certificate
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ host_secrets_dir }}", mode: "0700"}
    - {path: "{{ pki_ca_cert | dirname }}", mode: "0755"}
  delegate_to: localhost
  run_once: true
  become: false

- name: Check whether the CA key and certificate already exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ pki_ca_key }}"
    - "{{ pki_ca_cert }}"
  register: pki_ca_files
  delegate_to: localhost
  run_once: true
  become: false

- name: Refuse to pair a new key with an existing CA certificate
  ansible.builtin.assert:
    that: pki_ca_files.results[0].stat.exists or not pki_ca_files.results[1].stat.exists
    fail_msg: >-
      {{ pki_ca_cert }} exists but {{ pki_ca_key }} does not: restore .secrets/ca.key,
      or delete certs/ca.crt to create a new CA.
    quiet: true
  delegate_to: localhost
  run_once: true
  become: false

- name: Create the CA private key (EC P-256)
  community.crypto.openssl_privatekey:
    path: "{{ pki_ca_key }}"
    type: ECC
    curve: secp256r1
    mode: "0600"
    regenerate: never
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true

- name: Build the CA certificate signing request
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ pki_ca_key }}"
    common_name: "{{ pki_ca_common_name }}"
    basic_constraints: ["CA:TRUE", "pathlen:0"]
    basic_constraints_critical: true
    key_usage: [keyCertSign, cRLSign]
    key_usage_critical: true
    name_constraints_permitted: "{{ pki_ca_permitted_names }}"
    name_constraints_excluded: "{{ pki_ca_excluded_names }}"
    name_constraints_critical: true
    use_common_name_for_san: false
  register: pki_ca_csr
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true
  changed_when: false
  when: not pki_ca_files.results[1].stat.exists

- name: Create the self-signed CA certificate
  community.crypto.x509_certificate:
    path: "{{ pki_ca_cert }}"
    csr_content: "{{ pki_ca_csr.csr }}"
    privatekey_path: "{{ pki_ca_key }}"
    provider: selfsigned
    selfsigned_not_after: "{{ pki_ca_validity }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true
  when: not pki_ca_files.results[1].stat.exists

- name: Read the CA key's public key
  community.crypto.openssl_privatekey_info:
    path: "{{ pki_ca_key }}"
  register: pki_ca_key_info
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true

- name: Read the CA certificate's public key
  community.crypto.x509_certificate_info:
    path: "{{ pki_ca_cert }}"
  register: pki_ca_cert_info
  delegate_to: localhost
  run_once: true
  become: false

- name: Assert the CA key matches the CA certificate
  ansible.builtin.assert:
    that: pki_ca_key_info.public_key_fingerprints.sha256 == pki_ca_cert_info.public_key_fingerprints.sha256
    fail_msg: >-
      {{ pki_ca_key }} does not match {{ pki_ca_cert }}: restore the matching .secrets/ca.key,
      or delete both files to create a new CA.
    quiet: true
  delegate_to: localhost
  run_once: true
  become: false
