---
# Node prerequisites for kubeadm + containerd (req 1).
# Air-gapped VM (vm_proxy_url set): apt goes through the proxy, before the first apt task here or in later roles.
- name: Configure the apt proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/95indev-proxy
    content: |
      Acquire::http::Proxy "{{ vm_proxy_url }}";
      Acquire::https::Proxy "{{ vm_proxy_url }}";
    mode: "0644"
    owner: root
    group: root
  when: vm_proxy_url | length > 0

- name: Remove the apt proxy when the VM has direct internet
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/95indev-proxy
    state: absent
  when: vm_proxy_url | length == 0

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] | int > 0
  changed_when: true

- name: Comment out swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]\S*\s+\S+\s+swap\s.*)$'
    replace: '# \1'

- name: List systemd swap units  # noqa: command-instead-of-module
  ansible.builtin.command: systemctl list-units --type=swap --all --plain --no-legend
  register: os_prep_swap_units
  changed_when: false

- name: Mask systemd swap units
  ansible.builtin.systemd_service:
    name: "{{ item.split()[0] }}"
    masked: true
  loop: "{{ os_prep_swap_units.stdout_lines }}"

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: "{{ os_prep_kernel_modules | join('\n') }}\n"
    mode: "0644"
    owner: root
    group: root

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ os_prep_kernel_modules }}"

- name: Set sysctls (persisted in /etc/sysctl.d)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    sysctl_set: true
    reload: true
    state: present
  loop: "{{ os_prep_sysctls | dict2items }}"

# Live mirrors stay first; apt falls back to the snapshot for versions Debian has since replaced.
- name: Add the Debian snapshot sources (pinned timestamp)
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: [deb]
    uris: ["https://snapshot.debian.org/archive/{{ item.archive }}/{{ debian_snapshot_timestamp }}/"]
    suites: "{{ item.suites }}"
    components: [main]
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    check_valid_until: false
  loop:
    - { name: snapshot-debian, archive: debian, suites: [trixie, trixie-updates] }
    - { name: snapshot-debian-security, archive: debian-security, suites: [trixie-security] }
  register: os_prep_snapshot_repos

- name: Install base packages at pinned versions
  ansible.builtin.apt:
    name: "{{ item.key }}={{ item.value if item.value is string else item.value[os_prep_arch] }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if os_prep_snapshot_repos is changed else 86400 }}"
  loop: "{{ os_base_packages | dict2items }}"

- name: Hold base packages
  ansible.builtin.dpkg_selections:
    name: "{{ item.key }}"
    selection: hold
  loop: "{{ os_base_packages | dict2items }}"

# The VM is air-gapped: outbound only to itself and the cluster (plus a reviewer's proxy, by IP: the VM has no DNS, B-093).
- name: Check the extra egress targets are IPv4 addresses
  ansible.builtin.assert:
    that: vm_egress_allow_extra | reject('match', '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') | list | length == 0
    fail_msg: "proxy= must be an IPv4 address (the air-gapped VM has no DNS): {{ vm_egress_allow_extra }}"
    quiet: true

- name: Set the extra egress addresses
  ansible.builtin.set_fact:
    os_prep_egress_allow_ips: "{{ vm_egress_allow_extra }}"

- name: Write the air-gap firewall rules
  ansible.builtin.template:
    src: indev-airgap.nft.j2
    dest: "{{ os_prep_airgap_rules }}"
    mode: "0644"
    owner: root
    group: root
  notify: Reload the air-gap firewall

- name: Install the air-gap firewall unit
  ansible.builtin.template:
    src: indev-airgap.service.j2
    dest: /etc/systemd/system/indev-airgap.service
    mode: "0644"
    owner: root
    group: root
  notify: [Reload the air-gap firewall, Re-enable the air-gap firewall unit]

- name: Enable and start the air-gap firewall
  ansible.builtin.systemd_service:
    name: indev-airgap
    enabled: true
    state: started
    daemon_reload: true

- name: Apply a changed firewall now
  ansible.builtin.meta: flush_handlers
