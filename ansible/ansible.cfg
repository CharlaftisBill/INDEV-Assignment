[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
host_key_checking = False
retry_files_enabled = False
forks = 5
timeout = 30

[ssh_connection]
pipelining = True
# Lima writes a ready-to-use ssh config per instance; host alias is "lima-<name>".
ssh_args = -F ~/.lima/k8s/ssh.config -o ControlMaster=auto -o ControlPersist=60s
