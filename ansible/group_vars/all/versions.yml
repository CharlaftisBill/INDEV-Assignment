# SINGLE SOURCE OF TRUTH for every pinned version in this project.
# Rules (see CLAUDE.md and the pin-version skill):
#   - exact versions only, never "latest" / floating tags / unpinned apt packages
#   - one comment per entry: where the version was looked up and when
