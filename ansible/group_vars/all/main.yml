---
# Cluster-wide settings. Versions live in versions.yml, never here.

cluster_name: indev
node_name: k8s-node

# Networking. Lima's user-mode network uses 192.168.5.0/24, so we avoid
# Calico's 192.168.0.0/16 default.
pod_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12
cluster_dns_domain: cluster.local

# Proxy for the VM's own downloads (apt, containerd, helm, get_url). Empty: direct internet (Lima).
# inventory/external.yml sets it for an air-gapped VM: the host's egress proxy over SSH, or the reviewer's proxy.
vm_proxy_url: ""
vm_no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] | default('') }},{{ pod_cidr }},{{ service_cidr }},.svc,.{{ cluster_dns_domain }}"
vm_proxy_env: >-
  {{ {} if vm_proxy_url | length == 0 else
     {'http_proxy': vm_proxy_url, 'https_proxy': vm_proxy_url, 'HTTP_PROXY': vm_proxy_url, 'HTTPS_PROXY': vm_proxy_url,
      'no_proxy': vm_no_proxy, 'NO_PROXY': vm_no_proxy} }}

# Hostnames served by the ingress (resolved on the Mac via /etc/hosts -> 127.0.0.1)
llm_hostname: llm.local
grafana_hostname: grafana.local

# Namespaces
ns_cni_operator: tigera-operator
ns_storage: local-path-storage
ns_cert_manager: cert-manager
ns_ingress: traefik
ns_monitoring: monitoring
ns_llm: llm

# Application namespaces get Pod Security Admission "restricted" (enforce/audit/warn)
app_namespaces:
  - "{{ ns_llm }}"

# Host-side paths (relative to the repo root; Ansible runs on the Mac)
repo_root: "{{ playbook_dir }}/.."
host_out_dir: "{{ repo_root }}/out"
host_secrets_dir: "{{ repo_root }}/.secrets"
host_ca_cert: "{{ repo_root }}/certs/ca.crt"

# Certificates issued by the internal CA (pki role) for every Ingress host: renewal starts 30 days before expiry.
pki_cluster_issuer: internal-ca
pki_cert_duration: 2160h
pki_cert_renew_before: 720h

# Node-side paths
node_textfile_dir: /var/lib/node_exporter/textfile_collector  # node-exporter textfile collector (read via its /host/root mount)
node_backup_dir: /mnt/host-backups      # Lima mount of ./backups on the Mac
etcd_backup_schedule: "*-*-* *:00/30:00"  # systemd OnCalendar: every 30 min
etcd_backup_retention: 48               # number of snapshots kept
audit_log_dir: /var/log/kubernetes/audit
